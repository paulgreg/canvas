<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2d starfield</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="myCanvas"></canvas>
    <script>
      const canvas = document.getElementById("myCanvas");
      const context = canvas.getContext("2d");

      const backgroundColor = "black";
      const starColor = "white";

      const resizeCanvas = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      context.fillStyle = backgroundColor;
      context.fillRect(0, 0, canvas.width, canvas.height);

      const size = 500;
      const starX = [];
      const starY = [];
      const starDX = [];

      for (let i = 0; i < size; i++) {
        starX[i] = Number.parseInt(Math.random() * canvas.width, 10);
        starY[i] = Number.parseInt(Math.random() * canvas.height, 10);
        starDX[i] = Math.random() * 5 + 1;
      }

      const loop = () => {
        context.fillStyle = backgroundColor;
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < size; i++) {
          context.fillStyle = backgroundColor;
          context.fillRect(starX[i], starY[i], 2, 2);

          starX[i] -= starDX[i];

          context.fillStyle = starColor;
          context.fillRect(starX[i], starY[i], 2, 2);

          if (starX[i] <= 0) starX[i] = canvas.width;
        }
        requestAnimationFrame(loop);
      };
      loop();
    </script>
  </body>
</html>
